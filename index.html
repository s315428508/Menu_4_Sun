<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="今儿吃点嘛">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <title>今儿吃点嘛</title>
    <style>
        :root {
            --primary-color: #789262;
            --bg-color: #f9fbf7;
            --card-bg: #ffffff;
            --text-main: #3a4035;
            --text-light: #8a9184;
            --danger-color: #e88d8d;
            --sep-color: #eee;
        }

        body {
            font-family: "PingFang SC", sans-serif;
            background-color: #eef2eb;
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
        }

        #app {
            width: 100%;
            max-width: 500px;
            background: var(--bg-color);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
        }

        .header {
            padding: 25px 25px 15px;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .about-trigger {
            cursor: pointer;
            font-size: 24px;
            transition: transform 0.2s;
        }

        .about-trigger:active {
            transform: scale(1.2) rotate(10deg);
        }

        .content {
            flex: 1;
            padding: 10px 20px;
            overflow-y: auto;
            padding-bottom: 160px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 15px rgba(120, 146, 98, 0.06);
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .ing-card {
            justify-content: space-between;
        }

        .ing-count {
            background: #f0f4eb;
            color: var(--primary-color);
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .custom-cb {
            width: 26px;
            height: 26px;
            border: 2px solid #e0e0e0;
            border-radius: 50%;
            appearance: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            cursor: pointer;
        }

        .custom-cb:checked {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        .custom-cb:checked::after {
            content: "✓";
            color: white;
            font-size: 14px;
        }

        .recipe-card {
            justify-content: space-between;
        }

        .recipe-title {
            font-size: 17px;
            font-weight: bold;
        }

        .fuzzy-sep {
            display: flex;
            align-items: center;
            margin: 25px 0 15px;
            color: var(--text-light);
            font-size: 12px;
        }

        .fuzzy-sep::before,
        .fuzzy-sep::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--sep-color);
            margin: 0 10px;
        }

        .fab-container {
            position: absolute;
            bottom: 90px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .fab-main {
            width: 60px;
            height: 60px;
            background: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            box-shadow: 0 6px 20px rgba(120, 146, 98, 0.35);
            cursor: pointer;
            pointer-events: auto;
        }

        .side-btn {
            position: absolute;
            pointer-events: auto;
            background: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            cursor: pointer;
        }

        .clear-btn {
            left: 30px;
            color: var(--danger-color);
        }

        .confirm-btn {
            right: 30px;
            color: var(--primary-color);
        }

        .nav-bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: white;
            display: flex;
            border-top: 1px solid #f2f2f2;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: bold;
            color: var(--text-light);
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--primary-color);
        }

        .nav-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary-color);
            margin-top: 6px;
            visibility: hidden;
        }

        .nav-item.active .nav-dot {
            visibility: visible;
        }

        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(30, 35, 25, 0.4);
            backdrop-filter: blur(6px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            border-radius: 28px;
            padding: 32px;
            width: 82%;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            box-sizing: border-box;
        }

        .about-box {
            text-align: center;
            line-height: 1.6;
        }

        .about-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        .about-ver {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 20px;
            display: block;
        }

        .about-desc {
            font-size: 14px;
            color: var(--text-main);
            text-align: justify;
            margin-bottom: 25px;
        }

        .about-author {
            font-size: 13px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .modal-action {
            margin-top: 24px;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #f0f2ef;
            border-radius: 14px;
            background: #f9fbf9;
            box-sizing: border-box;
            outline: none;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div id="app">
        <div class="header">
            <span id="page-title">新鲜食材</span>
            <span class="about-trigger" onclick="showAbout()">🥑</span>
        </div>

        <div id="ingredient-page" class="content">
            <div id="ingredient-list"></div>
            <div id="ing-empty" style="display:none; text-align:center; margin-top:100px; color:var(--text-light);">
                <span style="font-size:56px; opacity:0.3;">🍳</span>
                <p>冰箱空空的，去买点菜吧</p>
            </div>
        </div>

        <div id="menu-page" class="content" style="display:none;">
            <div id="menu-display"></div>
        </div>

        <div class="fab-container">
            <div id="left-action" class="side-btn clear-btn" onclick="handleClearAll()">清空</div>
            <div class="fab-main" onclick="handleFabClick()">+</div>
            <div id="right-action" class="side-btn confirm-btn" onclick="handleQuickProduce()">确认</div>
        </div>

        <div class="nav-bar">
            <div id="nav-ing" class="nav-item active" onclick="switchTab('ing')"><span>食材库</span>
                <div class="nav-dot"></div>
            </div>
            <div id="nav-menu" class="nav-item" onclick="switchTab('menu')"><span>建议菜单</span>
                <div class="nav-dot"></div>
            </div>
        </div>

        <div id="modal-box" class="modal-overlay" onclick="closeOnOverlay(event)">
            <div class="modal-content" onclick="event.stopPropagation()" id="modal-inner"></div>
        </div>
    </div>

    <script>
        let ingredients = JSON.parse(localStorage.getItem('fridge_v7')) || [];
        let recipes = JSON.parse(localStorage.getItem('recipes_v7')) || [];
        let currentTags = [];
        let activeTab = 'ing';

        function renderIngList() {
            const list = document.getElementById('ingredient-list');
            const empty = document.getElementById('ing-empty');
            ingredients = ingredients.filter(i => i.count > 0);
            list.innerHTML = '';
            if (ingredients.length === 0) { empty.style.display = 'block'; }
            else {
                empty.style.display = 'none';
                ingredients.forEach((item, index) => {
                    list.innerHTML += `<div class="card ing-card"><div class="ing-info"><span style="font-weight:600">${item.name}</span> <span class="ing-count">${item.count}</span></div><input type="checkbox" class="custom-cb" value="${index}"></div>`;
                });
            }
            localStorage.setItem('fridge_v7', JSON.stringify(ingredients));
        }

        function matchAndShowMenu() {
            const display = document.getElementById('menu-display');
            if (currentTags.length === 0) {
                display.innerHTML = `<div style="text-align:center; margin-top:100px; color:var(--text-light);"><span style="font-size:56px; opacity:0.3;">💡</span><p>先在食材页勾选你要用的原材</p></div>`;
                return;
            }
            const tagStr = currentTags.join(',');
            const exactMatches = recipes.filter(r => r.tags === tagStr);
            const fuzzyMatches = recipes.filter(r => (r.tags !== tagStr && r.tags.split(',').some(t => currentTags.includes(t))));

            let html = '';
            if (exactMatches.length > 0) {
                html += `<p style="text-align:center; color:var(--text-light); font-size:12px;">精准匹配</p>`;
                exactMatches.forEach(m => html += renderRecipeCard(m));
            }
            if (fuzzyMatches.length > 0) {
                html += `<div class="fuzzy-sep">也许你还想做</div>`;
                fuzzyMatches.forEach(m => html += renderRecipeCard(m));
            }
            if (exactMatches.length === 0 && fuzzyMatches.length === 0) {
                html = `<div style="text-align:center; margin-top:100px; color:var(--text-light);"><span style="font-size:56px; opacity:0.3;">🍳</span><p>这个组合还没做过菜，点击 + 记录一下</p></div>`;
            }
            display.innerHTML = html;
        }

        function renderRecipeCard(m) {
            return `<div class="card recipe-card"><span class="recipe-title">${m.name}</span><span style="color:var(--danger-color); cursor:pointer; font-size:20px;" onclick="deleteRecipe(${recipes.indexOf(m)})">🗑️</span></div>`;
        }

        function showAbout() {
            const inner = document.getElementById('modal-inner');
            inner.innerHTML = `<div class="about-box"><span class="about-title">今儿吃点嘛</span><span class="about-ver">Version 1.0</span><p class="about-desc">这是一份随时间成长的私家味蕾记忆。它不只是工具，更是一个养成系的厨艺伙伴。随着每一次食材入库与菜肴记录，它会愈发懂你的口味，最终汇聚成那本——只属于你的独家菜谱。</p><div class="about-author">作者：Sun_Th3ee</div><button class="modal-action" onclick="closeModals()">返回</button></div>`;
            document.getElementById('modal-box').style.display = 'flex';
        }

        function handleFabClick() {
            const inner = document.getElementById('modal-inner');
            if (activeTab === 'ing') {
                inner.innerHTML = `
                <h3 style="margin:0 0 20px 0; text-align:center;">新食材入库</h3>
                <input type="text" id="new-name" placeholder="比如：西红柿" autofocus onkeyup="if(event.key==='Enter') saveIng()">
                <div style="display:flex; justify-content:center; align-items:center; gap:25px; margin:25px 0;">
                    <button onclick="changeNum(-1)" style="width:44px;height:44px;border-radius:50%;border:1px solid #eee;background:white;">-</button>
                    <span id="modal-num" style="font-size:22px; font-weight:bold;">1</span>
                    <button onclick="changeNum(1)" style="width:44px;height:44px;border-radius:50%;border:1px solid #eee;background:white;">+</button>
                </div>
                <button class="modal-action" onclick="saveIng()">存入冰箱</button>
            `;
            } else {
                inner.innerHTML = `
                <h3 style="margin:0 0 10px 0; text-align:center;">记录新菜谱</h3>
                <p style="font-size:12px; color:var(--text-light); text-align:center; margin-bottom:18px;">针对食材：${currentTags.join(' + ') || '（未选）'}</p>
                <input type="text" id="new-recipe" placeholder="比如：西红柿炒蛋" autofocus onkeyup="if(event.key==='Enter') saveRecipe()">
                <button class="modal-action" onclick="saveRecipe()">保存记忆</button>
            `;
            }
            document.getElementById('modal-box').style.display = 'flex';
            setTimeout(() => document.querySelector('#modal-inner input').focus(), 100);
        }

        function saveIng() {
            const name = document.getElementById('new-name').value.trim();
            const count = parseInt(document.getElementById('modal-num').innerText);
            if (!name) return;
            const ex = ingredients.find(i => i.name === name);
            if (ex) ex.count += count; else ingredients.push({ name, count });
            renderIngList(); closeModals();
        }
        function saveRecipe() {
            const name = document.getElementById('new-recipe').value.trim();
            if (!name || currentTags.length === 0) return;
            recipes.push({ name, tags: currentTags.join(',') });
            localStorage.setItem('recipes_v7', JSON.stringify(recipes));
            matchAndShowMenu(); closeModals();
        }
        function handleQuickProduce() {
            const c = Array.from(document.querySelectorAll('.custom-cb:checked'));
            if (c.length === 0) return alert("请先选食材");
            currentTags = c.map(el => { const idx = el.value; ingredients[idx].count--; return ingredients[idx].name; }).sort();
            renderIngList(); matchAndShowMenu(); switchTab('menu');
        }
        function deleteRecipe(idx) { if (confirm("确定删除？")) { recipes.splice(idx, 1); localStorage.setItem('recipes_v7', JSON.stringify(recipes)); matchAndShowMenu(); } }
        function handleClearAll() { if (ingredients.length > 0 && confirm("清空冰箱？")) { ingredients = []; renderIngList(); } }
        function switchTab(t) {
            activeTab = t;
            document.getElementById('ingredient-page').style.display = t === 'ing' ? 'block' : 'none';
            document.getElementById('menu-page').style.display = t === 'menu' ? 'block' : 'none';
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('nav-' + t).classList.add('active');
            document.getElementById('page-title').innerText = t === 'ing' ? '新鲜食材' : '美味建议';
            document.getElementById('left-action').style.display = document.getElementById('right-action').style.display = (t === 'ing' ? 'block' : 'none');
            if (t === 'menu') matchAndShowMenu();
        }
        function changeNum(v) { const el = document.getElementById('modal-num'); let n = parseInt(el.innerText) + v; if (n >= 1) el.innerText = n; }
        function closeModals() { document.getElementById('modal-box').style.display = 'none'; }
        function closeOnOverlay(e) { if (e.target.id === 'modal-box') closeModals(); }

        renderIngList();
    </script>
</body>

</html>
